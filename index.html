<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr. India AR Experience</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background: #080808;
      font-family: Arial, sans-serif;
    }

    #message {
      position: fixed;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
      letter-spacing: 2px;
    }

    #info {
      display: none;
      position: fixed;
      bottom: 25px;
      left: 5%;
      width: 90%;
      padding: 20px;
      box-sizing: border-box;
      background: rgba(10,10,10,.95);
      border: 1px solid #FFD447;
      border-radius: 12px;
      color: white;
      text-align: center;
      z-index: 20;
    }

    #info h2 {
      color: #FFD447;
      letter-spacing: 3px;
    }

    #close {
      background: #FFD447;
      border: none;
      padding: 10px 25px;
      border-radius: 5px;
    }

    .clickable {
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="message">SCAN THE MR. INDIA POSTER</div>

  <div id="info">
    <h2 id="characterName"></h2>
    <p id="characterDescription"></p>
    <button id="close" onclick="closeInfo()">BACK TO POSTER</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./mrindia.mind;"
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="poster" src="./poster.jpg">
    </a-assets>

    <a-camera position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-plane
        src="#poster"
        width="1"
        height="1.5"
        position="0 0 0">
      </a-plane>

      <!-- Sridevi -->
      <a-entity
        class="clickable"
        geometry="primitive: ring; radiusInner: 0.075; radiusOuter: 0.09"
        material="color: #FFD447; shader: flat"
        position="-0.28 0.38 0.04"
        onclick="showInfo('SEEMA','Explore Sridevi, Hawa Hawai, fashion and her character.')">
        <a-animation attribute="scale"
          from="1 1 1" to="1.2 1.2 1"
          direction="alternate" dur="1000"
          repeat="indefinite"></a-animation>
      </a-entity>

      <!-- Anil Kapoor -->
      <a-entity
        class="clickable"
        geometry="primitive: ring; radiusInner: 0.075; radiusOuter: 0.09"
        material="color: #FFD447; shader: flat"
        position="0.25 0.05 0.04"
        onclick="showInfo('MR. INDIA','Discover Arun, invisibility and his gadgets.')">
      </a-entity>

      <!-- Mogambo -->
      <a-entity
        class="clickable"
        geometry="primitive: ring; radiusInner: 0.075; radiusOuter: 0.09"
        material="color: #FFD447; shader: flat"
        position="0 -0.48 0.04"
        onclick="showInfo('MOGAMBO','Explore the iconic villain and his famous dialogue.')">
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('[mindar-image-target]');
    const message = document.getElementById('message');

    target.addEventListener('targetFound', () => {
      message.textContent = 'CHOOSE A CHARACTER';
    });

    target.addEventListener('targetLost', () => {
      message.textContent = 'SCAN THE MR. INDIA POSTER';
      closeInfo();
    });

    function showInfo(name, description) {
      document.getElementById('characterName').textContent = name;
      document.getElementById('characterDescription').textContent = description;
      document.getElementById('info').style.display = 'block';
    }

    function closeInfo() {
      document.getElementById('info').style.display = 'none';
    }
  </script>

</body>
</html>
