
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr. India AR Experience</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background: #080808;
      font-family: Arial, sans-serif;
    }

    #message {
      position: fixed;
      top: 20px;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
      letter-spacing: 2px;
      pointer-events: none;
    }

    /* Full-screen video transition */
    #videoScreen {
      position: fixed;
      inset: 0;
      background: black;
      z-index: 100;
      display: none;
      overflow: hidden;
    }

    #videoScreen.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #experienceVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
      transform: scale(0.12);
      opacity: 0;
    }

    #videoScreen.zooming #experienceVideo {
      animation: zoomIntoVideo 1.1s cubic-bezier(.2,.8,.2,1) forwards;
    }

    @keyframes zoomIntoVideo {
      0% {
        transform: scale(0.12);
        opacity: 0;
      }
      45% {
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    #closeVideo {
      display: none;
      position: absolute;
      top: 25px;
      right: 20px;
      z-index: 110;
      background: rgba(0,0,0,.7);
      color: white;
      border: 1px solid #FFD447;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: bold;
    }

    #videoScreen.playing #closeVideo {
      display: block;
    }
  </style>
</head>

<body>

  <div id="message">SCAN THE MR. INDIA POSTER</div>

  <div id="videoScreen">
    <video
      id="experienceVideo"
      src="./sridevi-video.mp4"
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <button id="closeVideo">← BACK TO POSTER</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./mrindia.mind;"
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="poster" src="./poster.jpg">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: .clickable">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Poster -->
      <a-plane
        src="#poster"
        width="1"
        height="1.5"
        position="0 0 0">
      </a-plane>

      <!-- Sridevi -->
      <a-entity
        id="srideviMarker"
        class="clickable"
        geometry="primitive: ring; radiusInner: 0.075; radiusOuter: 0.09"
        material="color: #FFD447; shader: flat"
        position="-0.28 0.34 0.04"
        animation="property: scale; from: 1 1 1; to: 1.18 1.18 1; dir: alternate; dur: 1000; loop: true">
      </a-entity>

      <!-- Anil Kapoor -->
      <a-entity
        class="clickable"
        geometry="primitive: ring; radiusInner: 0.075; radiusOuter: 0.09"
        material="color: #FFD447; shader: flat"
        position="0.22 0.12 0.04">
      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const marker = document.getElementById("srideviMarker");
    const video = document.getElementById("experienceVideo");
    const screen = document.getElementById("videoScreen");
    const closeButton = document.getElementById("closeVideo");
    const message = document.getElementById("message");
    const target = document.querySelector("[mindar-image-target]");

    let videoOpen = false;

    marker.addEventListener("click", async () => {
      if (videoOpen) return;

      videoOpen = true;
      video.currentTime = 0;

      screen.classList.add("active");
      screen.classList.remove("zooming", "playing");

      message.textContent = "ENTERING SEEMA'S WORLD";

      // Allow the screen to appear before starting the zoom
      requestAnimationFrame(() => {
        screen.classList.add("zooming");
      });

      try {
        await video.play();
      } catch (error) {
        console.error("Video playback failed:", error);
        message.textContent = "VIDEO COULD NOT PLAY";
        closeExperience();
        return;
      }

      video.addEventListener("playing", () => {
        screen.classList.add("playing");
      }, { once: true });

      message.style.display = "none";
    });

    function closeExperience() {
      video.pause();
      video.currentTime = 0;

      screen.classList.remove("active", "zooming", "playing");
      videoOpen = false;

      message.style.display = "block";
      message.textContent = "CHOOSE A CHARACTER";
    }

    closeButton.addEventListener("click", closeExperience);

    video.addEventListener("ended", closeExperience);

    target.addEventListener("targetFound", () => {
      if (!videoOpen) {
        message.textContent = "CHOOSE A CHARACTER";
      }
    });

    target.addEventListener("targetLost", () => {
      if (videoOpen) {
        closeExperience();
      }
      message.textContent = "SCAN THE MR. INDIA POSTER";
    });
  </script>

</body>
</html>
