
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mr India - AR Experience</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      background: #090909;
      font-family: Arial, sans-serif;
    }

    #message {
      position: fixed;
      top: 25px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      z-index: 10;
      font-size: 18px;
      letter-spacing: 2px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="message">SCAN THE MR. INDIA POSTER</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets/mrindia.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Poster tracking -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Background panel -->
      <a-plane
        color="#160810"
        opacity="0.9"
        width="1"
        height="0.3"
        position="0 0.35 0">
      </a-plane>

      <!-- Detection message -->
      <a-text
        value="POSTER DETECTED!"
        color="#ff4b91"
        align="center"
        width="2"
        position="0 0.35 0.01">
      </a-text>

    </a-entity>

  </a-scene>

  <script>
    const target = document.querySelector(
      '[mindar-image-target]'
    );

    const message = document.getElementById('message');

    target.addEventListener('targetFound', () => {
      message.textContent = "WELCOME TO MR. INDIA";
    });

    target.addEventListener('targetLost', () => {
      message.textContent = "SCAN THE MR. INDIA POSTER";
    });
  </script>

</body>
</html>
